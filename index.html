<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="theme-color" content="#111b2a"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23192b3c%22/%3E%3Cpath d=%22M15 22l10 10-10 10M30 42h20%22 fill=%22none%22 stroke=%22%2383e2c2%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi 会话工作台</title><link rel="stylesheet" href="/xterm.css"><link rel="stylesheet" href="/style.css"></head><body><div id="desktop-titlebar" class="desktop-titlebar"><span class="desktop-mark">›_</span><span class="desktop-title">Pi 会话工作台</span><div class="desktop-controls"><button id="win-min" title="最小化" aria-label="最小化">―</button><button id="win-max" title="最大化或还原" aria-label="最大化或还原">□</button><button id="win-close" title="关闭窗口" aria-label="关闭窗口">×</button></div></div><aside id="sidebar"><div class="brand"><div class="logo">π</div><div><b>Pi 工作台</b><small>CODING WORKSPACE <span id="app-version"></span></small></div></div><div class="side-title"><span>模型与额度</span><button id="refresh" title="刷新额度">↻</button></div><div id="providers"><p class="loading">正在读取模型…</p></div><footer>本机运行 <span>●</span><br>工作目录 <span id="current-directory">读取中…</span></footer></aside><section class="workspace"><header><button id="sidebar-toggle" class="sidebar-toggle" title="收起侧边栏" aria-label="收起侧边栏" aria-expanded="true">☰</button><div class="heading"><h1>会话工作区</h1><p>选择左侧模型，创建独立的 Pi 会话</p></div><label class="theme-picker"><span>主题</span><select id="theme-select" aria-label="选择主题"><option value="mint">夜幕薄荷</option><option value="jilan">霁蓝夜色</option><option value="dongqing">东青</option><option value="mist">雾蓝浅色</option></select></label><button id="settings-toggle" class="settings-toggle" aria-label="设置工作目录" title="设置工作目录">⚙</button><button id="fullscreen" class=
